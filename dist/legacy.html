<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101c2d">
<meta name="description" content="Wydarzenia, restauracje i nowe znajomości dla osób podróżujących na statku.">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="profile.css?v=1">
<link rel="stylesheet" href="style.css?v=37">
<title>CrewConnect — Na pokładzie</title>
</head>
<body class="crewconnect-layout">
<aside class="sidebar" aria-label="CrewConnect">
  <a class="brand" href="#aktywnosci"><span class="logo" aria-hidden="true">⚓</span><span>Crew<span>Connect</span></span></a>
  <button type="button" class="mobile-menu-toggle" aria-expanded="false" aria-controls="mobile-navigation">
    <span class="menu-icon" aria-hidden="true"></span><span>Menu</span>
  </button>
  <div class="sidebar-panel" id="mobile-navigation">
  <nav aria-label="Menu główne">
    <div class="nav-group" role="group" aria-labelledby="nav-life">
      <p id="nav-life">Życie na pokładzie</p>
      <a href="#aktywnosci" data-page="aktywnosci">Aktywności</a>
      <a href="#kalendarz" data-page="kalendarz">Kalendarz</a>
      <a href="#restauracje" data-page="restauracje">Restauracje</a>
      <a href="#zaloga" data-page="zaloga">Poznaj ludzi</a>
      <a href="#statystyki" data-page="statystyki">Statystyki statku</a>
      <a class="ship-nav-link" href="#mapa" data-page="mapa">Mapa statku</a>
    </div>
  </nav>
  <div class="profile"><span>Mój profil</span><a id="crew" href="#profil" data-page="profil">Dodaj mój profil</a></div>
  </div>
</aside>
<main>
  <header class="top"><span><span class="dot"></span> MV Horizon</span><span id="network">Brak aktywnego profilu</span>
    <details class="notification-menu" hidden>
      <summary aria-label="Powiadomienia"><span aria-hidden="true">🔔</span><span data-unread hidden></span></summary>
      <section class="notification-popover" aria-label="Centrum powiadomień">
        <h2>Powiadomienia</h2>
        <div class="notification-tools"><button class="secondary" type="button" data-notification-action="readAll">Oznacz jako przeczytane</button>
          <button class="secondary" type="button" data-notification-action="clear">Wyczyść listę</button></div>
        <div class="notification-list"></div>
      </section>
    </details><button id="install" class="secondary" hidden>Zainstaluj PWA</button></header>
  <div id="content"></div>
</main>
<footer class="site-footer">
  <div class="site-footer-inner">
    <div class="site-footer-identity">
      <a class="brand" href="#aktywnosci"><span class="logo" aria-hidden="true">⚓</span><span>Crew<span>Connect</span></span></a>
      <p>MV Horizon</p>
    </div>
    <nav class="site-footer-links" aria-label="Nawigacja w stopce">
      <a href="#kalendarz">Kalendarz rejsu</a>
      <a href="#restauracje" data-page="restauracje">Restauracje</a>
      <a href="#zaloga">Poznaj ludzi</a>
      <a href="#mapa">Mapa statku</a>
      <a href="#statystyki">Statystyki statku</a>
    </nav>
  </div>
</footer>
<dialog id="dialog"></dialog>
<div id="notice" role="status" aria-live="polite"></div>
<script src="voice.js?v=18" defer></script>
<script src="duties.js?v=27" defer></script>
<script src="restaurants.js?v=1" defer></script>
<script src="statistics.js?v=2" defer></script>
<script src="profile.js?v=1" defer></script>
<script src="notifications.js?v=1" defer></script>
<script src="app.js?v=37" defer></script>
</body>
</html>
