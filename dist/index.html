<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c2d">
  <meta name="description" content="Wydarzenia i spotkania podczas Twojego rejsu">
  <meta name="crewconnect-api" content="">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="social.css?v=10">
  <link rel="stylesheet" href="profile.css?v=1">
  <title>CrewConnect — Wydarzenia na rejsie</title>
</head>
<body>
  <a class="skip-link" href="#content">Przejdź do treści</a>
  <aside class="sidebar">
    <a class="brand" href="#wydarzenia"><span class="brand-icon" aria-hidden="true">⚓</span><span>Crew<span>Connect</span></span></a>
    <nav id="navigation" class="app-nav" aria-label="Menu główne" hidden></nav>
    <div id="sidebar-profile" class="sidebar-profile" hidden>
      <span id="sidebar-user-name"></span>
      <a id="sidebar-account" href="#profil">Mój profil</a>
    </div>
  </aside>
  <header class="app-header">
    <span id="trip-label"></span>
    <div class="header-context">
      <a id="ship-map-link" class="button secondary" href="#mapa">Mapa statku</a>
      <a id="role-link" class="button secondary" href="#planner" hidden>Panel plannera</a>
    </div>
  </header>
  <main id="content" tabindex="-1"></main>
  <template id="file-help">
    <div class="auth-view">
      <section class="surface">
        <h1>Otwórz CrewConnect przez serwer</h1>
        <p>W katalogu projektu uruchom <code>node server.mjs</code>, a następnie otwórz lokalny adres aplikacji.</p>
        <a class="button primary" href="http://localhost:3000/">Otwórz lokalne CrewConnect</a>
      </section>
    </div>
  </template>
  <p id="connection" class="connection" role="status" hidden></p>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="notice" role="status" aria-live="polite"></div>
  <script>
    if (location.protocol === 'file:') {
      document.querySelector('#content').append(document.querySelector('#file-help').content.cloneNode(true));
    }
  </script>
  <script src="profile.js?v=1" defer></script>
  <script type="module" src="social.js?v=11"></script>
</body>
</html>
